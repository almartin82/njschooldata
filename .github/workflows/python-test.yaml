name: Python Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    env:
      NJSCHOOLDATA_LIVE_TESTS: "false"

    steps:
      - uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes
          needs: |
            website
            coverage

      - name: Install R package
        run: |
          Rscript -e 'remotes::install_local(".", dependencies = TRUE, force = TRUE)'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "./python[dev]"

      # Hosted Ubuntu is a disposable VM; provision the rootless boundary
      # before testing. Ubuntu 24.04 restricts unprivileged user namespaces
      # unless bubblewrap has an AppArmor profile granting userns.
      - name: Prepare no-egress boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if command -v apparmor_parser >/dev/null 2>&1; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '  include if exists <local/bwrap>' '}' | sudo tee /etc/apparmor.d/bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi

      - name: Run Python tests inside the no-egress boundary
        run: |
          tools/ci/run_no_egress.sh -- bash -c 'cd python && pytest tests/ -v --tb=short'

# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NJSCHOOLDATA_LIVE_TESTS: "false"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build offline documentation contract
        if: github.event_name == 'pull_request'
        run: source("tools/docs/build-offline-docs.R")
        shell: Rscript {0}

      # docs/ is gitignored except for the contract-declared source-validation
      # report, so a fresh checkout leaves docs/ non-empty and without a
      # pkgdown.yml marker. pkgdown's clean_site() refuses to touch a non-empty
      # docs/ it did not build, which aborted every deploy from 2026-07-29
      # onward. A local docs/ IS a built pkgdown site, so this never reproduced
      # off CI. Move the tracked file aside; the checkout is ephemeral.
      - name: Clear tracked files out of the pkgdown destination
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-tracked"
          git ls-files docs | while read -r f; do
            dest="$RUNNER_TEMP/docs-tracked/${f#docs/}"
            mkdir -p "$(dirname "$dest")"
            mv "$f" "$dest"
          done
          ls -A docs 2>/dev/null || echo "docs/ is now empty"

      - name: Build site
        if: github.event_name != 'pull_request'
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    # Campaign documentation HOLD; release requires the reserved public review.
    if: ${{ false }}
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NJSCHOOLDATA_LIVE_TESTS: "false"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build offline documentation contract
        if: github.event_name == 'pull_request'
        run: source("tools/docs/build-offline-docs.R")
        shell: Rscript {0}

      # docs/ is gitignored. When it held a tracked file, a fresh checkout left
      # docs/ non-empty and without a pkgdown.yml marker. pkgdown's
      # clean_site() refuses to touch a non-empty docs/ it did not build, which
      # aborted every deploy from 2026-07-29 onward. The step stays as a guard
      # against any future tracked file under docs/; the checkout is ephemeral.
      - name: Clear tracked files out of the pkgdown destination
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-tracked"
          git ls-files docs | while read -r f; do
            dest="$RUNNER_TEMP/docs-tracked/${f#docs/}"
            mkdir -p "$(dirname "$dest")"
            mv "$f" "$dest"
          done
          ls -A docs 2>/dev/null || echo "docs/ is now empty"

      - name: Build site
        if: github.event_name != 'pull_request'
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # pkgdown renders every root-level .md file into a page. Repository
      # working notes must never reach the public site, so drop any root page
      # that is not a standard site page before deploying. Subdirectories
      # (reference/, articles/, news/, almanac/, profiles/, deps/) are kept.
      - name: Filter internal pages from the built site
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cd docs
          allow="index 404 authors LICENSE LICENSE-text CODE_OF_CONDUCT DATA-CATEGORY-TAXONOMY"
          deny="AGENTS CLAUDE TODO EXPANSION CHANGES GOALS"
          for stem in $deny; do
            rm -fv "$stem".md "$stem".html
          done
          for f in *.md *.html; do
            [ -e "$f" ] || continue
            stem="${f%.*}"
            case " $allow " in
              *" $stem "*) ;;
              *) rm -fv "$f" ;;
            esac
          done
          python3 - <<'PY'
          import json, os, re
          root = set(os.listdir("."))
          def gone(url):
              m = re.search(r"/([^/]+\.(?:html|md))$", url or "")
              if not m:
                  return False
              # only root-level pages are filtered
              is_root = not re.search(r"/(reference|articles|news|almanac|profiles|deps)/", url)
              return is_root and m.group(1) not in root
          if os.path.exists("search.json"):
              with open("search.json") as fh:
                  data = json.load(fh)
              data = [d for d in data if not gone(d.get("path", ""))]
              with open("search.json", "w") as fh:
                  json.dump(data, fh)
          if os.path.exists("sitemap.xml"):
              with open("sitemap.xml") as fh:
                  xml = fh.read()
              xml = re.sub(r"\s*<url>\s*<loc>([^<]*)</loc>.*?</url>",
                           lambda m: "" if gone(m.group(1)) else m.group(0),
                           xml, flags=re.S)
              with open("sitemap.xml", "w") as fh:
                  fh.write(xml)
          if os.path.exists("llms.txt"):
              with open("llms.txt") as fh:
                  lines = fh.readlines()
              keep = [l for l in lines
                      if not any(gone(u) for u in re.findall(r"\((https?://[^)\s]+)\)", l))]
              with open("llms.txt", "w") as fh:
                  fh.writelines(keep)
          PY
          ls -1 *.md *.html

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
